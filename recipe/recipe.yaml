context:
  name: cf-nvidia-tools
  version: "1.1.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  - path: .

build:
  script:
    - if: win
      then: build.bat
      else: build.sh
  number: 0
  skip: not (linux or win)

requirements:
  build:
    - if: linux
      then:
        - shellcheck
  host:
    - python
    - pip
    - setuptools
    - setuptools-scm
  run:
    - if: linux
      then:
        - patchelf >=0.12
    - python >=3.10
    - cuda-cuobjdump

tests:
  - if: linux
    then:
      - requirements:
          run:
            - dav1d-dev
        script:
        - check-glibc || true
        - export c_stdlib_version="99.99.99"
        - check-glibc "${CONDA_PREFIX}"/lib/*.so.*
        # Also check that tool will exit 1 if c_stdlib_version is too old
        - export c_stdlib_version="0.0.1"
        - "[ $(check-glibc ${CONDA_PREFIX}/lib/*.so.* &>/dev/null; echo $?) -eq 1 ]"
  - requirements:
      run:
        - libcublas 13.*
    script:
      # Separate native scripts, not a shared Python one, so each platform's test actually
      # exercises the shell setting idiom documented for it (bash `export X="$(...)"` vs.
      # cmd.exe `for /f ... do set X=...`), not just a subprocess call into the tool.
      - if: win
        then: test_trim_cuda_archs.bat
        else: test_trim_cuda_archs.sh
about:
  summary: NVIDIA's feedstock validation and linting tools for conda-forge
  description: >
    This package contains CLI tools for validating and linting NVIDIA's conda recipes on
    conda-forge. For a description of the tools see the README in the package feedstock. The
    tools are hosted directly in the feedstock; there is no external source code repository
    for these tools at this time.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/conda-forge/cf-nvidia-tools-feedstock

extra:
  feedstock-name: cf-nvidia-tools
  recipe-maintainers:
    - conda-forge/cuda
